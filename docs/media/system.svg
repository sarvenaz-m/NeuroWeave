<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="710" viewBox="0 0 1500 710" role="img" aria-label="NeuroWeave system architecture overview"><rect width="1500" height="710" fill="#080d18"/><text x="58" y="65" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#ff9858" font-weight="normal" letter-spacing="2">NEUROWEAVE / SYSTEM MAP</text><text x="55" y="128" font-family="DejaVu Sans, sans-serif" font-size="41" fill="#f3f6fc" font-weight="bold" >Two instruments. One research record.</text><rect x="58" y="183" width="670" height="345" fill="#10192b" stroke="#2a3953"/><path d="M58 183H728" stroke="#6b9cff" stroke-width="3"/><text x="85" y="220" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#6b9cff" font-weight="normal" >01 / SIGNAL CONSOLE</text><text x="83" y="267" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#f3f6fc" font-weight="bold" >Inspect the model.</text><text x="87" y="315" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a6b2c8" font-weight="normal" >01   Synthetic or imported 8-channel windows</text><text x="87" y="361" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a6b2c8" font-weight="normal" >02   Quality checks → waveform + spectral analysis</text><text x="87" y="407" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a6b2c8" font-weight="normal" >03   Synthetic-only CNN + spectral baseline</text><text x="87" y="453" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a6b2c8" font-weight="normal" >04   Python ↔ JavaScript numerical agreement</text><rect x="772" y="183" width="670" height="345" fill="#10192b" stroke="#2a3953"/><path d="M772 183H1442" stroke="#ff9858" stroke-width="3"/><text x="799" y="220" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#ff9858" font-weight="normal" >02 / INTERACTION BENCH</text><text x="797" y="267" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#f3f6fc" font-weight="bold" >Observe the response.</text><text x="801" y="315" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a6b2c8" font-weight="normal" >01   Sequence Buffer / Rule Router</text><text x="801" y="361" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a6b2c8" font-weight="normal" >02   Geometric response pads + keyboard input</text><text x="801" y="407" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a6b2c8" font-weight="normal" >03   Pause-aware timing + explicit difficulty choice</text><text x="801" y="453" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a6b2c8" font-weight="normal" >04   Trial-level outcomes → JSON + CSV</text><path d="M391 528V557H1107V528M750 557V588" stroke="#47628e" fill="none"/><rect x="490" y="588" width="520" height="53" fill="#182843" stroke="#47628e"/><text x="567" y="621" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#f3f6fc" font-weight="bold" >RUN LEDGER / LOCAL EXPORTS</text><text x="58" y="686" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#a6b2c8" font-weight="normal" >Independent observations, not synchronised EEG. Model predictions never control task difficulty.</text></svg>